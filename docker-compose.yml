services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: movie_app
    working_dir: /var/www
    user: "${DOCKER_UID}:${DOCKER_GID}"
    volumes:
      - .:/var/www

  nginx:
    image: nginx:alpine
    container_name: movie_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:17
    container_name: movie_postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: movie_reservation
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: movie_redis
    ports:
      - "6377:6379"
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: movie_worker
    working_dir: /var/www
    user: "${DOCKER_UID}:${DOCKER_GID}"
    volumes:
      - .:/var/www
    command: php artisan queue:work redis --sleep=3 --tries=3
    depends_on:
      - app
      - redis

volumes:
    postgres_data: