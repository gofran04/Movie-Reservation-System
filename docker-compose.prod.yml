services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: movie_app
    working_dir: /var/www
    volumes:
      - laravel_public:/var/www/public
      - laravel_storage:/var/www/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
    image: movie_app_image
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION}
      REDIS_HOST: ${REDIS_HOST}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: movie_nginx
    ports:
      - "8000:80"
    volumes:
      - laravel_public:/var/www/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: movie_postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: movie_reservation
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d movie_reservation"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: movie_redis
    ports:
      - "6377:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    image: movie_app_image
    container_name: movie_worker
    working_dir: /var/www
    entrypoint: ["/var/www/docker/php/worker-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
    restart: unless-stopped
    

volumes:
    postgres_data:
    laravel_public:
    laravel_storage: